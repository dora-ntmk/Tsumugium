[project]
name = "tsumugium"
version = "3.0.8"
description = "Tsumugium - Discord 読み上げボット"
requires-python = ">=3.11"
dependencies = [
  "discord-py>=2.7.0",
  "requests>=2.32.5",
  "python-dotenv>=1.2.2",
  "aiohttp>=3.9.0",
  "PyNaCl>=1.6.0",
  "davey>=0.1.0",
  "ffmpeg-python",
]

[tool.ruff]
indent-width = 2
line-length = 200
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
