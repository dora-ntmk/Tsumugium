name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # requirements.lock を作る uv のバージョン（同じ手順で毎回同じロックを作るため固定する）
  UV_VERSION: "0.13.8"

jobs:
  gate:
    name: 確かめ済みかを調べる
    runs-on: ubuntu-latest
    # mainへのpushで、同じ中身をPRですでに確かめていれば、確かめ直しを省く。
    # PRで確かめた中身（マージした結果のツリー）とマージ後のコミットの中身が同じなら、結果も同じになるため。
    # mainが進んでいた、mainへ直接pushした、などで見つからないときは、今までどおりすべて確かめる。
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      # 見つけた記録の名前と、それを残したPRの実行。build がPRのときの requirements.lock を取りに行く
      artifact: ${{ steps.check.outputs.artifact }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      - name: 同じ中身をPRで確かめたかを調べる
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "verified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "このコミットの中身: $tree"
          # フォークからのPRの成果物は、そのPRが書き換えたワークフローで作れるので数えない
          # 同じ中身を何度か確かめていれば、いちばん新しい記録を使う
          run_id="$(gh api "repos/$GH_REPO/actions/artifacts?name=verified-tree-$tree&per_page=100" \
            --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == $REPO_ID)] | sort_by(.created_at) | last | .workflow_run.id // empty" \
            || true)"
          if [ -n "$run_id" ]; then
            echo "同じ中身をPRで確かめ済みなので、確かめ直しを省きます（記録を残した実行: $run_id）"
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "artifact=verified-tree-$tree" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "### PRで確かめ済みの中身なので、テストなどの確かめ直しを省きました" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "確かめ済みの記録がないので、すべて確かめます"
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: テスト (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存をインストール
        run: python -m pip install -r requirements.txt

      - name: 構文を確かめる
        run: python -m compileall -q .

      - name: テストを実行
        run: python -m unittest discover -s tests -v

  static-checks:
    name: 静的チェック
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 変更分の空白を確かめる (git diff --check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE_SHA"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          echo "比較の基準: $base"
          git diff --check "$base" HEAD

      - name: 削除済み要素が残っていないかを確かめる
        run: |
          status=0
          if grep -rnE '^\s*(import requests|from requests( |\.))' --include='*.py' .; then
            echo "::error::requests のimportが残っています"
            status=1
          fi
          if git ls-files --error-unmatch messages.py >/dev/null 2>&1; then
            echo "::error::messages.py が残っています"
            status=1
          fi
          if grep -rnE 'name=["'"'"']language["'"'"']' --include='*.py' .; then
            echo "::error::/setting language のコマンド定義が残っています"
            status=1
          fi
          exit $status

      - name: 入れてはいけないファイルがないかを確かめる
        run: |
          forbidden="$(git ls-files | grep -E '^\.env$|^db/.*\.db$|^tmp/|^backup/' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::コミットしてはいけないファイルがあります"
            echo "$forbidden"
            exit 1
          fi

  build:
    name: 配布物の作成
    runs-on: ubuntu-latest
    # 確かめ済みでテストを省いたときも作る。build-info.json にこのコミットを書くので、PRで作ったものは使えない
    needs: [gate, test]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.gate.outputs.verified == 'true'))
    permissions:
      contents: read
      # PRの実行が残した requirements.lock を取りに行くため
      actions: read
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      channel: ${{ steps.build.outputs.channel }}
      lock_same: ${{ steps.compare.outputs.same }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 版（ベータ番号）はタグから、LAST_UPDATED はコミット日から決めるので、履歴とタグをすべて取る
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: uvをインストール
        run: python -m pip install "uv==${UV_VERSION}"

      - name: requirements.lockを作る（ハッシュ値つき、Python 3.10以上のどのバージョンでも使える形）
        # --universal で、Python 3.13以上だけで要る依存（audioop-lts など）も条件付きで書き出す
        run: |
          uv pip compile requirements.txt \
            --universal \
            --python-version 3.10 \
            --generate-hashes \
            --no-header \
            --output-file requirements.lock

      - name: requirements.lockを成果物として保存する
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: error

      - name: PRで確かめたときのrequirements.lockを取ってくる
        if: needs.gate.outputs.verified == 'true'
        # 古い記録にはロックが入っていない。取れなければ lock-check を動かすだけなので、失敗にはしない
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact }}
          run-id: ${{ needs.gate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified

      - name: PRのときと同じロックかを比べる
        id: compare
        # 同じなら、PRの lock-check で確かめたものと同じなので、lock-check を省く
        run: |
          if [ -f "$RUNNER_TEMP/verified/requirements.lock" ] && cmp -s requirements.lock "$RUNNER_TEMP/verified/requirements.lock"; then
            echo "PRで確かめたロックと同じなので、lock-check を省きます"
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "### PRで確かめたrequirements.lockと同じなので、lock-checkを省きました" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
          fi

      - name: zipとSHA256値を作る
        id: build
        # 版はタグだけで決める（下書きはこの権限では見えない）。Releaseに使う版は release ジョブで決め直す
        run: python scripts/build_release.py --lock requirements.lock --out dist

      - name: 成果物として保存する
        uses: actions/upload-artifact@v4
        with:
          # ダウンロードすると、この名前のzipの中に配布用のzipと.sha256が入っている。
          # 中のzipと同じ名前にすると取り違えやすいので、Releaseに添付するものだと分かる名前にする。
          name: release-assets-tsumugium-${{ steps.build.outputs.tag }}
          path: dist/
          if-no-files-found: error

  lock-check:
    name: requirements.lockの確認 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # requirements.txt は範囲指定なので、マージ後に作り直したロックはPRのときと違うことがある。
    # PRで確かめたロックとまったく同じときだけ省く
    needs: build
    # gate から test が省かれたときも動かすため、build の結果だけを見る
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.lock_same != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 配布物と同じrequirements.lockから入れる
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: 主な依存を読み込めるかを確かめる
        run: /tmp/lock-check/bin/python -c "import discord, nacl, aiohttp, dotenv, davey; print('discord.py', discord.__version__, 'davey', davey.__version__, 'PyNaCl', nacl.__version__)"

  installer-e2e:
    name: インストーラーの結合テスト
    runs-on: ubuntu-24.04
    # 止まったときに既定の6時間待たないようにする（ふだんは3分ほど。aptが遅い日は10分を超える）
    timeout-minutes: 40
    needs: [gate, test]
    if: needs.gate.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 対象の変更があるかを確かめる
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # 手動の実行では必ず走らせる
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE_SHA"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          # パイプの途中で grep -q が先に終わると pipefail で失敗扱いになるため、一度変数に受ける
          changed="$(git diff --name-only "$base" HEAD)"
          pattern='^(installer/|install\.sh$|requirements\.txt$|services/ready_state_service\.py$|scripts/(build_release|ci_installer_e2e)\.py$|\.github/workflows/ci\.yml$)'
          # config.py の VERSION・LAST_UPDATED の行は、正式版を出すときなどに変わる。
          # 結合テストはこの2つの値を使わないので、ほかの行が変わったときだけ対象にする
          config_lines="$(git diff -U0 "$base" HEAD -- config.py | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)"
          config_other="$(grep -vE '^([+-](VERSION|LAST_UPDATED)[[:space:]]*=|$)' <<< "$config_lines" || true)"
          if grep -qE "$pattern" <<< "$changed" || [ -n "$config_other" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "インストーラーに関わる変更がないため、結合テストは省きます"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          # ubuntu-24.04 の /usr/bin/python3 と同じ版で、偽のBot用の依存を固める
          python-version: "3.12"

      - name: 配布物と同じ作り方でrequirements.lockを作る
        if: steps.changes.outputs.run == 'true'
        # 偽のBotが使うのは python-dotenv だけだが、本物の依存を入れられることも確かめる
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip compile requirements.txt \
            --universal \
            --python-version 3.10 \
            --generate-hashes \
            --no-header \
            --output-file requirements-e2e.lock

      # インストーラーが apt で入れる ffmpeg（80個ほど・約60MB）は、ランナーのミラーからの取得が
      # 100kB/s 台まで落ちて10分近くかかることがある。前回取得した .deb を apt のキャッシュに戻しておき、
      # インストーラー自身の apt-get update・apt-get install はそのまま動かして、取得だけを省く。
      # apt は .deb をパッケージ一覧のハッシュ値と照合するので、版が変わったものや中身の違うものは取り直す
      - name: apt で取得した .deb をキャッシュから戻す
        id: apt-cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-ubuntu-24.04-${{ github.run_id }}
          restore-keys: apt-debs-ubuntu-24.04-

      - name: 戻した .deb を apt のキャッシュに置く
        if: steps.changes.outputs.run == 'true' && steps.apt-cache.outputs.cache-matched-key != ''
        run: |
          count="$(find "$RUNNER_TEMP/apt-debs" -maxdepth 1 -name '*.deb' | wc -l)"
          echo "キャッシュから ${count} 個の .deb を戻します（${{ steps.apt-cache.outputs.cache-matched-key }}）"
          sudo cp "$RUNNER_TEMP"/apt-debs/*.deb /var/cache/apt/archives/

      - name: install から uninstall までを通しで動かす
        if: steps.changes.outputs.run == 'true'
        run: python scripts/ci_installer_e2e.py --lock requirements-e2e.lock

      - name: 今入っている版の .deb だけを集める
        id: apt-debs
        # 結合テストが途中で失敗しても、apt が取得し終えていれば残す
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: |
          rm -rf "$RUNNER_TEMP/apt-debs"
          mkdir -p "$RUNNER_TEMP/apt-debs"
          # 古い版の .deb がたまらないよう、インストール済みの版と一致するものだけを残す
          for deb in /var/cache/apt/archives/*.deb; do
            [ -e "$deb" ] || continue
            package="$(dpkg-deb -f "$deb" Package)"
            version="$(dpkg-deb -f "$deb" Version)"
            arch="$(dpkg-deb -f "$deb" Architecture)"
            if [ "$arch" = "all" ]; then target="$package"; else target="$package:$arch"; fi
            installed="$(dpkg-query -W -f='${Version}' "$target" 2>/dev/null || true)"
            if [ "$installed" = "$version" ]; then
              cp "$deb" "$RUNNER_TEMP/apt-debs/"
            fi
          done
          count="$(find "$RUNNER_TEMP/apt-debs" -maxdepth 1 -name '*.deb' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "残す .deb がありません（apt が取得していない、または取得後に消した）"
            echo "key=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest="$(cd "$RUNNER_TEMP/apt-debs" && ls -1 *.deb | sort | sha256sum | cut -c1-16)"
          echo "${count} 個の .deb を残します"
          echo "key=apt-debs-ubuntu-24.04-${digest}" >> "$GITHUB_OUTPUT"

      - name: .deb をキャッシュに残す
        # 戻したものと同じ組み合わせなら残し直さない
        if: >-
          !cancelled() && steps.apt-debs.outputs.key != '' &&
          steps.apt-debs.outputs.key != steps.apt-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-debs.outputs.key }}

  secret-scan:
    name: 秘密情報のスキャン
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verified:
    name: 確かめ済みの記録
    runs-on: ubuntu-latest
    # PRですべての確認が通ったら、確かめた中身（マージした結果のツリー）を成果物の名前に残す。
    # マージ後のpushで gate がこれを見つけると、確かめ直しを省く。
    # lock-check で確かめた requirements.lock も入れ、マージ後に同じロックができたら lock-check も省く。
    needs: [test, static-checks, build, lock-check, installer-e2e, secret-scan]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock
          path: ${{ runner.temp }}/lock

      - name: 確かめた中身を書き出す
        id: tree
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > verified-tree.txt
          cp "$RUNNER_TEMP/lock/requirements.lock" requirements.lock

      - name: 成果物として残す
        uses: actions/upload-artifact@v4
        with:
          name: verified-tree-${{ steps.tree.outputs.tree }}
          path: |
            verified-tree.txt
            requirements.lock
          retention-days: 30

  release:
    name: Releaseの作成
    runs-on: ubuntu-latest
    # mainに入ったときだけ動く。すべての確認が通ったコミットと requirements.lock から、版を決めて配布物を作る。
    #   正式版（config.py の VERSION が vX.X.X.XX で、まだ出していない）: Releaseの下書きを作る。公開は人が本文を書いてから行う
    #   ベータ版（それ以外）: 前のタグからコードが変わっていれば、プレリリースをすぐ公開する。ベータのチャンネルの環境はこれを取りに行く
    #   確かめ済みの中身なら、テストなどは省かれ、build と lock-check だけが通っていればよい。
    #   ロックもPRのときと同じなら、lock-check も省かれる
    needs: [gate, test, static-checks, build, lock-check, installer-e2e, secret-scan]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.lock-check.result == 'success' || (needs.lock-check.result == 'skipped' && needs.build.outputs.lock_same == 'true')) &&
      (needs.gate.outputs.verified == 'true' || (
        needs.test.result == 'success' && needs.static-checks.result == 'success' &&
        needs.installer-e2e.result == 'success' && needs.secret-scan.result == 'success'))
    permissions:
      # Releaseを作るために、このジョブだけ書き込みを許す
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 残すプレリリースの数
      KEEP_PRERELEASES: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          # 版をタグから決め、前のタグからのコミットの一覧を作るため、履歴とタグをすべて取る
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - name: 版を決めて配布物を作る
        id: build
        # ベータ番号が直前のpushのReleaseと重ならないよう、直列に動くこのジョブの中で決める。
        # config.py の VERSION が出した正式版（下書きを含む）なら、次のパッチのベータにする（AGENTS.md「バージョン表記」）
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/released.txt"
          python3 scripts/build_release.py --lock requirements.lock --out dist --released-file "$RUNNER_TEMP/released.txt"

      - name: 作るかどうかを決める
        id: decide
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "タグ $TAG はもうあるので、Releaseは作りません"
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif grep -qxF "$TAG" "$RUNNER_TEMP/released.txt"; then
            echo "$TAG の下書きはもうあるので、作りません"
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif [ "$(python3 scripts/release_notes.py --should-release "$TAG")" = "true" ]; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "前のタグからコードが変わっていないので、$TAG は作りません"
            echo "create=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 本文を作る
        if: steps.decide.outputs.create == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: python3 scripts/release_notes.py --tag "$TAG" --out "$RUNNER_TEMP/notes.md"

      - name: 正式版の下書きを作り、zipと.sha256を添付する
        if: steps.decide.outputs.create == 'true' && steps.build.outputs.channel == 'stable'
        # 下書きのあいだはタグを作らない。公開したときに、GitHubがこのコミットにタグを付ける。
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/tsumugium-$TAG.zip" \
            "dist/tsumugium-$TAG.zip.sha256" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "### Releaseの下書きを作りました: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: ベータ版のプレリリースを公開し、zipと.sha256を添付する
        if: steps.decide.outputs.create == 'true' && steps.build.outputs.channel == 'beta'
        # 公開と同時に、このコミットにタグを付ける
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/tsumugium-$TAG.zip" \
            "dist/tsumugium-$TAG.zip.sha256" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "### ベータ版を公開しました: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 古いプレリリースを消す
        if: steps.decide.outputs.create == 'true' && steps.build.outputs.channel == 'beta'
        # 新しいほうから KEEP_PRERELEASES 件だけ残し、残りはReleaseとタグを消す。下書きと正式版は消さない。
        run: |
          old="$(gh release list --limit 100 --json tagName,isPrerelease,isDraft,createdAt \
            --jq "[.[] | select(.isPrerelease and (.isDraft | not))] | sort_by(.createdAt) | reverse | .[${KEEP_PRERELEASES}:] | .[].tagName")"
          for tag in $old; do
            echo "古いプレリリースを消します: $tag"
            gh release delete "$tag" --cleanup-tag --yes
            echo "- 古いプレリリースを消しました: $tag" >> "$GITHUB_STEP_SUMMARY"
          done
