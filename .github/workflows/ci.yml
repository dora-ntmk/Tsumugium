name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # requirements.lock を作る uv のバージョン（同じ手順で毎回同じロックを作るため固定する）
  UV_VERSION: "0.13.8"

jobs:
  test:
    name: テスト (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存をインストール
        run: python -m pip install -r requirements.txt

      - name: 構文を確かめる
        run: python -m compileall -q .

      - name: テストを実行
        run: python -m unittest discover -s tests -v

  static-checks:
    name: 静的チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 変更分の空白を確かめる (git diff --check)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE_SHA"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          echo "比較の基準: $base"
          git diff --check "$base" HEAD

      - name: 削除済み要素が残っていないかを確かめる
        run: |
          status=0
          if grep -rnE '^\s*(import requests|from requests( |\.))' --include='*.py' .; then
            echo "::error::requests のimportが残っています"
            status=1
          fi
          if git ls-files --error-unmatch messages.py >/dev/null 2>&1; then
            echo "::error::messages.py が残っています"
            status=1
          fi
          if grep -rnE 'name=["'"'"']language["'"'"']' --include='*.py' .; then
            echo "::error::/setting language のコマンド定義が残っています"
            status=1
          fi
          exit $status

      - name: 入れてはいけないファイルがないかを確かめる
        run: |
          forbidden="$(git ls-files | grep -E '^\.env$|^db/.*\.db$|^tmp/|^backup/' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::コミットしてはいけないファイルがあります"
            echo "$forbidden"
            exit 1
          fi

  build:
    name: 配布物の作成
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.build.outputs.tag }}
      channel: ${{ steps.build.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: uvをインストール
        run: python -m pip install "uv==${UV_VERSION}"

      - name: requirements.lockを作る（ハッシュ値つき、Python 3.10以上のどのバージョンでも使える形）
        # --universal で、Python 3.13以上だけで要る依存（audioop-lts など）も条件付きで書き出す
        run: |
          uv pip compile requirements.txt \
            --universal \
            --python-version 3.10 \
            --generate-hashes \
            --no-header \
            --output-file requirements.lock

      - name: requirements.lockを成果物として保存する
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
          if-no-files-found: error

      - name: zipとSHA256値を作る
        id: build
        run: python scripts/build_release.py --lock requirements.lock --out dist

      - name: 成果物として保存する
        uses: actions/upload-artifact@v4
        with:
          # ダウンロードすると、この名前のzipの中に配布用のzipと.sha256が入っている。
          # 中のzipと同じ名前にすると取り違えやすいので、Releaseに添付するものだと分かる名前にする。
          name: release-assets-tsumugium-${{ steps.build.outputs.tag }}
          path: dist/
          if-no-files-found: error

  lock-check:
    name: requirements.lockの確認 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: requirements-lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 配布物と同じrequirements.lockから入れる
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: 主な依存を読み込めるかを確かめる
        run: /tmp/lock-check/bin/python -c "import discord, nacl, aiohttp, dotenv, davey; print('discord.py', discord.__version__, 'davey', davey.__version__, 'PyNaCl', nacl.__version__)"

  installer-e2e:
    name: インストーラーの結合テスト
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 対象の変更があるかを確かめる
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # 手動の実行と、main へのPRでは必ず走らせる
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_BASE_REF" = "main" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && ! printf '%s' "$PUSH_BEFORE_SHA" | grep -qE '^0+$'; then
            base="$PUSH_BEFORE_SHA"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          pattern='^(installer/|install\.sh$|config\.py$|requirements\.txt$|services/ready_state_service\.py$|scripts/(build_release|ci_installer_e2e)\.py$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "$base" HEAD | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "インストーラーに関わる変更がないため、結合テストは省きます"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          # ubuntu-24.04 の /usr/bin/python3 と同じ版で、偽のBot用の依存を固める
          python-version: "3.12"

      - name: 配布物と同じ作り方でrequirements.lockを作る
        if: steps.changes.outputs.run == 'true'
        # 偽のBotが使うのは python-dotenv だけだが、本物の依存を入れられることも確かめる
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv pip compile requirements.txt \
            --universal \
            --python-version 3.10 \
            --generate-hashes \
            --no-header \
            --output-file requirements-e2e.lock

      - name: install から uninstall までを通しで動かす
        if: steps.changes.outputs.run == 'true'
        run: python scripts/ci_installer_e2e.py --lock requirements-e2e.lock

  secret-scan:
    name: 秘密情報のスキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Releaseの作成
    runs-on: ubuntu-latest
    # mainに入ったときだけ動く。すべての確認が通った配布物を、作り直さずにそのまま使う。
    #   正式版（VERSIONに (beta X) がない）: Releaseの下書きを作る。公開は人が本文を書いてから行う
    #   ベータ版（VERSIONが (beta X)）: プレリリースをすぐ公開する。ベータのチャンネルの環境はこれを取りに行く
    needs: [test, static-checks, build, lock-check, installer-e2e, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      # Releaseを作るために、このジョブだけ書き込みを許す
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 残すプレリリースの数
      KEEP_PRERELEASES: "5"
    steps:
      - uses: actions/checkout@v4
        with:
          # 前のタグからのコミットの一覧を作るため、履歴とタグをすべて取る
          fetch-depth: 0

      - name: 作るかどうかを決める
        id: decide
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "タグ $TAG はもうあるので、Releaseは作りません"
            echo "create=false" >> "$GITHUB_OUTPUT"
            # コードが変わったのにVERSIONが同じなら、(beta X) を上げ忘れている
            changed="$(python3 scripts/release_notes.py --changed-code-since "$TAG")"
            if [ -n "$changed" ]; then
              echo "::warning::$TAG のあとでコードが変わっていますが、VERSIONが $TAG のままなので、新しい版を出せませんでした。VERSIONの (beta X) を上げてください。変わったファイル: $(echo "$changed" | paste -sd ' ')"
            fi
          elif gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "$TAG"; then
            echo "$TAG の下書きはもうあるので、作りません"
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.decide.outputs.create == 'true'
        with:
          name: release-assets-tsumugium-${{ needs.build.outputs.tag }}
          path: dist

      - name: 本文を作る
        if: steps.decide.outputs.create == 'true'
        run: python3 scripts/release_notes.py --tag "$TAG" --out "$RUNNER_TEMP/notes.md"

      - name: 正式版の下書きを作り、zipと.sha256を添付する
        if: steps.decide.outputs.create == 'true' && needs.build.outputs.channel == 'stable'
        # 下書きのあいだはタグを作らない。公開したときに、GitHubがこのコミットにタグを付ける。
        run: |
          gh release create "$TAG" \
            "dist/tsumugium-$TAG.zip" \
            "dist/tsumugium-$TAG.zip.sha256" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "### Releaseの下書きを作りました: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: ベータ版のプレリリースを公開し、zipと.sha256を添付する
        if: steps.decide.outputs.create == 'true' && needs.build.outputs.channel == 'beta'
        # 公開と同時に、このコミットにタグを付ける
        run: |
          gh release create "$TAG" \
            "dist/tsumugium-$TAG.zip" \
            "dist/tsumugium-$TAG.zip.sha256" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "### ベータ版を公開しました: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 古いプレリリースを消す
        if: steps.decide.outputs.create == 'true' && needs.build.outputs.channel == 'beta'
        # 新しいほうから KEEP_PRERELEASES 件だけ残し、残りはReleaseとタグを消す。下書きと正式版は消さない。
        run: |
          old="$(gh release list --limit 100 --json tagName,isPrerelease,isDraft,createdAt \
            --jq "[.[] | select(.isPrerelease and (.isDraft | not))] | sort_by(.createdAt) | reverse | .[${KEEP_PRERELEASES}:] | .[].tagName")"
          for tag in $old; do
            echo "古いプレリリースを消します: $tag"
            gh release delete "$tag" --cleanup-tag --yes
            echo "- 古いプレリリースを消しました: $tag" >> "$GITHUB_STEP_SUMMARY"
          done
